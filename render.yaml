services:
  - type: web
    name: wa-support-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.rag.build_index"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: RAG_TOP_K
        value: "4"
      - key: RAG_MIN_SCORE
        value: "0.08"
      - key: LLM_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_TOOL_CALLS_PER_TURN
        value: "3"
      - key: MAX_RETRIES
        value: "2"
      - key: TRACE_LOG_PATH
        value: logs/traces.jsonl
